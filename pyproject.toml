[project]
name = "claude-scraper"
version = "0.1.0"
description = "Discover, fetch, and store partner-site documentation as a local Markdown corpus"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "httpx[http2]>=0.27",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.1",
    "markdownify>=1.2.3",
]

[project.optional-dependencies]
# Optional LLM enrichment pass over the already-extracted corpus (PLAN.md §7.4).
# Not needed to build the corpus itself.
enrich = ["anthropic>=0.40"]

# The change digest, phase 2 (docs/changefeed-phase-2.md). Optional on purpose: the
# deterministic half of the change feed — snapshots, diffs, ranking, and the compression
# that feeds a session — has no dependencies at all and must stay runnable without this.
# The SDK authenticates through the installed Claude Code CLI, so no API key is required.
digest = ["claude-agent-sdk>=0.1"]

# The local review UI (docs/review-tool-plan.md). Same posture as `digest`: the core
# pipeline never imports it, and `scripts/review.py` fails with an install hint when
# the extra is missing.
review = ["fastapi>=0.115", "uvicorn>=0.30"]

[project.scripts]
scraper = "scraper.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.6",
    "trafilatura>=2.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `changefeed` is an application built on the corpus, not part of building it. It imports
# `scraper`; `scraper` never imports it (docs/changefeed-plan.md).
packages = ["src/scraper", "src/changefeed", "src/corpusgraph", "src/review"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
