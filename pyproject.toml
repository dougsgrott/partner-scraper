[project]
name = "claude-scraper"
version = "0.1.0"
description = "Discover, fetch, and store partner-site documentation as a local Markdown corpus"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "httpx[http2]>=0.27",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.1",
    "markdownify>=1.2.3",
]

[project.optional-dependencies]
# Optional LLM enrichment pass over the already-extracted corpus (PLAN.md §7.4).
# Not needed to build the corpus itself.
enrich = ["anthropic>=0.40"]

[project.scripts]
scraper = "scraper.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scraper"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
