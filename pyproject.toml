[project]
name = "claude-scraper"
version = "0.1.0"
description = "Discover, fetch, enrich, and store partner-site docs via the Anthropic API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.scripts]
scraper = "scraper.cli:main"

[dependency-groups]
dev = [
    "claude-agent-sdk>=0.2.139",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scraper"]

[tool.ruff]
line-length = 100
