# Sources to scrape. See PLAN.md §5 — this file gains per-source `seeds`, `fetcher`,
# and `extractor` keys, plus global politeness `defaults`, as those land.
sources:
  anthropic:
    sitemaps: # both are listed in platform.claude.com/robots.txt
      - https://platform.claude.com/sitemap.xml
      - https://platform.claude.com/cookbook/sitemap.xml
    # Docs are served per-locale under /docs/{locale}/; pin to English to avoid
    # ingesting the same page in de/es/fr/... /cookbook/ has no locale segment.
    include_paths: # keep only URLs whose path matches one of these prefixes
      - /docs/en/
      - /cookbook/
    exclude_paths: [] # drop URLs matching any of these (wins over include_paths)
    # TRANSITIONAL: the LLM-classification taxonomy from the retired v1 path. Still read
    # by store/layout.py for the folder name; replaced by URL-derived `category` in
    # PLAN.md §7.3, at which point this key goes away.
    themes:
      - prompt-caching
      - tool-use
      - agents
      - models-and-pricing
      - streaming
      - other

  databricks:
    sitemaps:
      - https://docs.databricks.com/sitemap.xml
    # Docs are triplicated across clouds (/aws/, /gcp/, /azure/) and localized;
    # pin to one cloud + English so each doc is ingested once.
    include_paths:
      - /aws/en/
    exclude_paths: # disallowed by docs.databricks.com/robots.txt
      - /aws/en/archive/
      - /aws/en/search-for
    themes: # transitional — see note above
      - delta-lake
      - unity-catalog
      - mlflow
      - workflows
      - sql-warehouse
      - other

# Global filters, overridable per run (e.g. from CLI flags).
filters:
  published_after: null # e.g. 2025-01-01 to ingest only recent material
  published_before: null
  max_pages: null # cap pages per run (useful for test runs)
